ci:
  autoupdate_schedule: quarterly
  # The prettier and eslint hooks below run the repo's own copies out of node_modules
  # (both configs import @brain-bbqs/config), which pre-commit.ci cannot install (no
  # network at hook runtime); the `format:check` and `lint` steps in the Lint workflow
  # enforce them in CI instead.
  skip:
    - prettier
    - eslint

default_install_hook_types:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        # The repo's own prettier rather than an isolated hook environment: the config
        # re-exports @brain-bbqs/config/prettier, which resolves only from the app's
        # node_modules. Requires `npm ci` first.
        entry: npx --no -- prettier --write --ignore-unknown --config configs/prettier.config.js
        language: system
        types: [text]
      - id: eslint
        name: eslint
        # Runs the repo's own eslint (the exact package set and config `npm run lint`
        # uses), not an isolated hook environment: type-aware rules need the app's
        # node_modules for real type information, and TypeScript does not honor the
        # NODE_PATH an isolated environment would rely on. Requires `npm ci` first.
        entry: npx --no -- eslint --fix --config configs/eslint.config.js
        language: system
        types: [file]
        files: \.(js|cjs|mjs|ts|tsx)$

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
