name: Preview

on:
    - pull_request

concurrency: preview-${{ github.ref }}

jobs:
    deploy-preview:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # No build step yet: this app is a static index.html with no package.json.
            # - name: Set up Node.js
            #   uses: actions/setup-node@v6
            #   with:
            #       node-version: lts/*
            #       cache: npm

            # - name: Install dependencies
            #   run: npm ci

            # - name: Build app
            #   run: npm run build

            - name: Deploy preview
              uses: rossjrw/pr-preview-action@v1
              with:
                  source-dir: .
                  preview-branch: gh-pages
