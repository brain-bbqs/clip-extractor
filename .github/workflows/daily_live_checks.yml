name: Daily live checks

# Checks once a day that EMBER still answers the way the deployed site reads it (tests/live), and
# emails when it does not. Ordinary pull requests do not run it, so an outage on EMBER's side never
# turns an unrelated PR red; a PR that changes the checks themselves does, so they are proven first.
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/daily_live_checks.yml
      - configs/vitest.live.config.ts
      - tests/live/**

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live checks
        run: npm run test:live

  # Only a scheduled or manual run emails; a pull request's own run reports on the PR instead.
  notify:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [live]
    if: ${{ always() && needs.live.result == 'failure' && github.event_name != 'pull_request' }}
    steps:
      - uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: Clip Extractor Daily Live Checks"
          to: cody.c.baker.phd@gmail.com
          from: Clip Extractor <clip-extractor@users.noreply.github.com>
          body: "The daily live checks against EMBER failed, please check the run at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
