name: Deploy

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-main
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # No build step yet: this app is a static index.html with no package.json.
            # - name: Set up Node.js
            #   uses: actions/setup-node@v6
            #   with:
            #       node-version: lts/*
            #       cache: npm

            # - name: Install dependencies
            #   run: npm ci

            # - name: Build app
            #   run: npm run build

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: .
                  exclude_assets: '.github,README.md'
                  keep_files: true
